name: Sync Backend to Hugging Face Space

on:
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  sync:
    needs: verify
    if: vars.DEPLOY_TARGET == 'hf'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Hugging Face Hub CLI
        run: pip install huggingface_hub

      - name: Upload to Hugging Face Hub
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_SPACE"
          upload_dir="$(mktemp -d)"
          git archive HEAD:backend | tar -x -C "$upload_dir"
          cp README.md "$upload_dir/README.md"
          hf upload "$HF_SPACE" "$upload_dir" . --repo-type=space
