name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: google_ads_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:client-assets
      - run: git diff --exit-code -- client/vendor client/fonts
      - run: bun test
        env:
          RUN_LOCAL_MCP_SMOKE: '1'
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/google_ads_test
